name: Release

on:
    workflow_dispatch:
    release:
        types:
            - created
    # push:
    #     tags:
    #         - "v*"

permissions:
    contents: write # required to upload release assets (was: read)
    id-token: write # required for PyPI trusted publishing (OIDC)

jobs:
    release:
        name: release
        runs-on: ubuntu-latest
        if: github.repository == 'pdssp/psup-scraper'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  version: "0.12.*"
                  enable-cache: true
                  python-version: "3.14"

            - name: Set tag version
              id: tag
              run: |
                  echo "version=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
                  echo "version_no_v=${GITHUB_REF#refs/*/v}" >> "$GITHUB_OUTPUT"

            - name: Set module version
              id: module
              run: |
                  echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

            - name: Check tag matches package version
              if: ${{ steps.tag.outputs.version_no_v != steps.module.outputs.version }}
              run: |
                  echo "Tag (${{ steps.tag.outputs.version }}) does not match package version (${{ steps.module.outputs.version }})"
                  exit 1

            - name: Build package
              run: uv build

            - name: Zip build artifacts
              run: |
                  cd dist
                  zip -r "../psup-scraper-${{ steps.tag.outputs.version }}.zip" .
                  cd ..

            - name: Upload ZIP to release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ steps.tag.outputs.version }}" "psup-scraper-${{ steps.tag.outputs.version }}.zip"

            # Skip this stemp until the team agrees for a PyPi-like repo
            # - name: Publish to PyPI
            #   run: uv publish
